name: Deploy production

on:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    verify:
        name: Verify before deployment
        uses: ./.github/workflows/ci.yml

    deploy:
        permissions:
            contents: write
        needs: verify
        name: Deploy production to VPS
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Configure SSH
              env:
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
              run: |
                  install -d -m 700 ~/.ssh
                  printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts
            - name: Deploy exact verified commit
              id: deploy
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  DEPLOY_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
                    "$VPS_USER@$VPS_HOST" bash -s -- production "$DEPLOY_SHA" < infra/remote-deploy.sh | tee /tmp/deploy-result.log
                  if grep -qx "DEPLOYED_SHA=$DEPLOY_SHA" /tmp/deploy-result.log; then
                    echo "deployed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Calculate next version
              if: steps.deploy.outputs.deployed == 'true'
              id: version
              run: |
                  cd "$GITHUB_WORKSPACE"
                  git fetch --tags

                  latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

                  if [ -z "$latest_tag" ]; then
                    next_tag="v0.1.0"
                  else
                    version="${latest_tag#v}"
                    major=$(echo "$version" | cut -d. -f1)
                    minor=$(echo "$version" | cut -d. -f2)
                    patch=$(echo "$version" | cut -d. -f3)

                    patch=$((patch + 1))
                    next_tag="v${major}.${minor}.${patch}"
                  fi

                  echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
                  echo "Next tag: $next_tag"

            - name: Create GitHub release
              if: steps.deploy.outputs.deployed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cd "$GITHUB_WORKSPACE"

                  tag="${{ steps.version.outputs.next_tag }}"

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git tag "$tag"
                  git push origin "$tag"

                  gh release create "$tag" \
                    --target "$GITHUB_SHA" \
                    --title "$tag" \
                    --generate-notes
