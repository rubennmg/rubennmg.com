name: Deploy Production Premium

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: deploy-production-premium
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy frontend to Premium Hosting
        runs-on: ubuntu-latest
        environment: production

        defaults:
            run:
                working-directory: apps/frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: apps/frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build frontend
              run: npm run build

            - name: Deploy by FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.PREMIUM_FTP_HOST }}
                  username: ${{ secrets.PREMIUM_FTP_USER }}
                  password: ${{ secrets.PREMIUM_FTP_PASSWORD }}
                  local-dir: apps/frontend/dist/
                  server-dir: ${{ secrets.PREMIUM_FTP_TARGET_DIR }}
