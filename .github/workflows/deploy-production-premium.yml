name: Deploy Production Premium

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: deploy-production-premium
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy frontend to Premium Hosting
        runs-on: ubuntu-latest
        environment: production

        defaults:
            run:
                working-directory: apps/frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: apps/frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build frontend
              run: npm run build

            - name: Deploy by FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.PREMIUM_FTP_HOST }}
                  username: ${{ secrets.PREMIUM_FTP_USER }}
                  password: ${{ secrets.PREMIUM_FTP_PASSWORD }}
                  local-dir: apps/frontend/dist/
                  server-dir: ${{ secrets.PREMIUM_FTP_TARGET_DIR }}

            - name: Calculate next version
              id: version
              run: |
                  cd "$GITHUB_WORKSPACE"
                  git fetch --tags

                  latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

                  if [ -z "$latest_tag" ]; then
                    next_tag="v0.1.0"
                  else
                    version="${latest_tag#v}"
                    major=$(echo "$version" | cut -d. -f1)
                    minor=$(echo "$version" | cut -d. -f2)
                    patch=$(echo "$version" | cut -d. -f3)

                    patch=$((patch + 1))
                    next_tag="v${major}.${minor}.${patch}"
                  fi

                  echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
                  echo "Next tag: $next_tag"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cd "$GITHUB_WORKSPACE"

                  tag="${{ steps.version.outputs.next_tag }}"

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git tag "$tag"
                  git push origin "$tag"

                  gh release create "$tag" \
                    --target "$GITHUB_SHA" \
                    --title "$tag" \
                    --generate-notes
