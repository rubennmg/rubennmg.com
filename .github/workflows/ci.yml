name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  deployment-config:
    name: VPS deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment script and Compose
        run: |
          bash -n infra/deploy.sh infra/remote-deploy.sh infra/staging/deploy.sh infra/production/deploy.sh
          for environment in staging production; do
            docker compose --env-file "infra/$environment/.env.$environment.example" -f "infra/$environment/compose.yml" config --quiet
          done
          docker compose -f infra/proxy/compose.yml config --quiet
          docker run --rm -v "$PWD/infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          python3 infra/test_deploy.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Import application
        run: python -c "from app.main import app; print(app.title)"

      - name: Run backend tests
        run: pytest

  docker-backend:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t rubennmg-backend ./apps/backend
