name: Deploy Staging

on:
    push:
        branches: [develop]

permissions:
    contents: read

concurrency:
    group: deploy-staging
    cancel-in-progress: false

jobs:
    verify:
        name: Verify before deployment
        uses: ./.github/workflows/ci.yml

    deploy:
        needs: verify
        name: Deploy to VPS
        runs-on: ubuntu-latest
        environment: staging

        steps:
            - name: Configure SSH
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

            - name: Deploy staging stack
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  DEPLOY_SHA: ${{ github.sha }}
              run: |
                  ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOY_SHA" <<'EOF'
                    set -euo pipefail
                    deploy_sha="$1"
                    [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]
                    cd /home/deploy/apps/rubennmg.com
                    git fetch origin
                    if [ "$(git rev-parse origin/develop)" != "$deploy_sha" ]; then
                      echo "Skipping superseded staging commit."
                      exit 0
                    fi
                    git checkout develop
                    git reset --hard "$deploy_sha"
                    bash infra/staging/deploy.sh
                  EOF
