services:
    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_DB: rubennmg_local
            POSTGRES_USER: rubennmg
            POSTGRES_PASSWORD: change-me
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U rubennmg -d rubennmg_local"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - postgres_data:/var/lib/postgresql/data

    backend:
        image: python:3.12-slim
        working_dir: /app
        command: >
            sh -c "pip install -e . &&
            alembic upgrade head &&
            python -m app.scripts.seed &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
        environment:
            APP_ENV: development
            DATABASE_URL: postgresql+psycopg://rubennmg:change-me@db:5432/rubennmg_local
            CORS_ALLOWED_ORIGINS: http://localhost:4321,http://127.0.0.1:4321
            ADMIN_USERNAME: admin
            ADMIN_PASSWORD: change-me
            ENABLE_DEMO_DATA: "false"
            AUTH_SECRET_KEY: local-development-secret
            AUTH_COOKIE_NAME: rubennmg_session
            AUTH_SESSION_DAYS: "7"
        ports:
            - "8000:8000"
        volumes:
            - ../../apps/backend:/app
        depends_on:
            db:
                condition: service_healthy

    frontend:
        image: node:22-alpine
        working_dir: /app
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
        environment:
            PUBLIC_API_URL: http://localhost:8000
        ports:
            - "4321:4321"
        volumes:
            - ../../apps/frontend:/app
            - frontend_node_modules:/app/node_modules
        depends_on:
            - backend

volumes:
    postgres_data:
    frontend_node_modules:
