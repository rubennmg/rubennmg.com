name: staging
services:
    frontend:
        extends:
            file: ../compose.app.yml
            service: frontend
        networks:
            web:
                aliases: [staging-frontend]
    backend:
        extends:
            file: ../compose.app.yml
            service: backend
        environment:
            APP_ENV: staging
            DATABASE_URL: postgresql+psycopg://rubennmg:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/rubennmg_staging
        networks:
            web:
                aliases: [staging-backend]
            internal:
    db:
        extends:
            file: ../compose.app.yml
            service: db
        environment:
            POSTGRES_DB: rubennmg_staging

volumes:
    postgres_data:
        external: true
        name: staging_postgres_data

networks:
    web:
        external: true
        name: rubennmg_staging_web
    internal:
        # New network name avoids changing the old live staging_internal in place.
        name: rubennmg_staging_db
        internal: true
